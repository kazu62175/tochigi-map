</style></head><body style="margin:0;padding:16px;background:#eaf2f4"><section id="tochigi-map-app"><h2>栃木県 25市町マップ</h2><p class="intro">地図の市町村をクリックして、地域の情報へ移動できます。</p><div class="layout"><div class="map-panel"><svg id="mapSvg" viewBox="0 0 480 580" role="img" aria-label="栃木県25市町をクリックできる地図"><text x="240" y="278" text-anchor="middle" class="fallback">地図を読み込んでいます…</text></svg><div id="mapInfo" class="info" aria-live="polite">市町村の形にマウスを合わせると名前が表示されます</div></div><div class="right-panel"><h3>市町村名から選ぶ</h3><div class="city-list" id="cityList"></div><p class="foot">※リンク先は現在、仮設定です。<br>研究所内の各市町ページへ変更できます。</p></div></div><p class="foot">地図の形状：Geoshapeリポジトリ（行政区域GeoJSON）を読み込み／通信環境により表示できない場合は右側の市町一覧をご利用ください。</p></section><script>
(function(){
const cities=[{"code": "09201", "name": "宇都宮市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E5%AE%87%E9%83%BD%E5%AE%AE%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09202", "name": "足利市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E8%B6%B3%E5%88%A9%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09203", "name": "栃木市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E6%A0%83%E6%9C%A8%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09204", "name": "佐野市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E4%BD%90%E9%87%8E%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09205", "name": "鹿沼市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E9%B9%BF%E6%B2%BC%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09206", "name": "日光市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E6%97%A5%E5%85%89%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09208", "name": "小山市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E5%B0%8F%E5%B1%B1%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09209", "name": "真岡市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E7%9C%9F%E5%B2%A1%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09210", "name": "大田原市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E5%A4%A7%E7%94%B0%E5%8E%9F%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09211", "name": "矢板市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E7%9F%A2%E6%9D%BF%E5%B8%82%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09213", "name": "那須塩原市", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E9%82%A3%E9%A0%88%E5%A1%A9%E5%8E%9F%E5%B 6%9C%A8%E7%9C%8C%20%E5%A1%A9%E8%B0%B7%E7%94%BA%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09386", "name": "高根沢町", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E9%AB%98%E6%A0%B9%E6%B2%A2%E7%94%BA%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09407", "name": "那須町", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E9%82%A3%E9%A0%88%E7%94%BA%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}, {"code": "09411", "name": "那珂川町", "url": "https://www.google.com/search?q=%E6%A0%83%E6%9C%A8%E7%9C%8C%20%E9%82%A3%E7%8F%82%E5%B7%9D%E7%94%BA%20%E5%85%AC%E5%BC%8F%E3%82%B5%E3%82%A4%E3%83%88"}];
// 各市町の行の url をご自身のページのURLに差し替えてください。
const root=document.getElementById('tochigi-map-app'),list=root.querySelector('#cityList'),svg=root.querySelector('#mapSvg'),info=root.querySelector('#mapInfo'),NS='http://www.w3.org/2000/svg';
for(const c of cities){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=c.name;list.appendChild(a)}
function flatten(coords,typ){return typ==='Polygon'?[coords]:coords}
function segments(g){let polygons=[];if(!g)return polygons;if(g.type==='FeatureCollection'){for(const f of g.features)polygons.push(...segments(f.geometry));return polygons}if(g.type==='Feature')return segments(g.geometry);if(g.type==='GeometryCollection'){for(const geo of g.geometries)polygons.push(...segments(geo));return polygons}if(g.type==='Polygon')return [g.coordinates];if(g.type==='MultiPolygon')return g.coordinates;return []}
function project(pt,b){return [((pt[0]-b.minX)/(b.maxX-b.minX))*440+20, 560-((pt[1]-b.minY)/(b.maxY-b.minY))*520]}
function makePath(polys,b){return polys.map(p=>p.map(r=>r.map((q,i)=>{const [x,y]=project(q,b);return (i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)}).join(' ')+'Z').join(' ')).join(' ')}
async function load(){let completed=await Promise.allSettled(cities.map(async c=>{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch('https://geoshape.ex.nii.ac.jp/city/geojson/latest/'+c.code+'.geojson',{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();return {...c,polys:segments(data)}}finally{clearTimeout(t)}}));let shapes=completed.filter(x=>x.status==='fulfilled'&&x.value.polys.length).map(x=>x.value);if(!shapes.length){svg.innerHTML='<text x="240" y="270" text-anchor="middle" class="fallback">地図が読み込めませんでした</text><text x="240" y="293" text-anchor="middle" class="fallback">右の市町村一覧から選べます</text>';info.textContent='外部の地図データへの接続を確認してください';return}
let b={minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity};for(let s of shapes)for(let p of s.polys)for(let ring of p)for(let [x,y] of ring){b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
svg.replaceChildren();svg.setAttribute('viewBox','0 0 480 580');for(let c of shapes){const a=document.createElementNS(NS,'a');a.setAttribute('href',c.url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener noreferrer');a.setAttribute('aria-label',c.name);const title=document.createElementNS(NS,'title');title.textContent=c.name;a.appendChild(title);const path=document.createElementNS(NS,'path');path.setAttribute('class','municipality');path.setAttribute('d',makePath(c.polys,b));path.setAttribute('fill-rule','evenodd');a.appendChild(path);a.addEventListener('mouseenter',()=>info.textContent=c.name+' をクリックして移動');a.addEventListener('mouseleave',()=>info.textContent='市町村の形にマウスを合わせると名前が表示されます');svg.appendChild(a)}
// Centroids from polygon outer-ring vertices; label as many as can fit
for(const c of shapes){let largest=c.polys.map(p=>p[0]).sort((a,b)=>b.length-a.length)[0];if(!largest)continue;let xx=0,yy=0;for(let pt of largest){xx+=pt[0];yy+=pt[1]}let [x,y]=project([xx/largest.length,yy/largest.length],b);let text=document.createElementNS(NS,'text');text.setAttribute('x',x);text.setAttribute('y',y);text.setAttribute('class','map-label'+(c.name.length>4?' small':''));text.textContent=c.name;svg.appendChild(text)}
if(shapes.length!==25)info.textContent=shapes.length+'市町の地図を表示中。表示されない市町は一覧から選択してください';}
load().catch(()=>info.textContent='地図を読み込めない場合は、市町村名一覧から選択できます');
})();</script></body></html>
