<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栃木県25市町クリックマップ</title><style>
#tochigi-map-app{font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:#1b3543;max-width:1020px;margin:auto;padding:20px;background:linear-gradient(155deg,#f6fbfe,#edf8f0);border-radius:22px;box-sizing:border-box}#tochigi-map-app *{box-sizing:border-box}#tochigi-map-app h2{font-size:clamp(22px,4vw,32px);text-align:center;margin:0 0 8px;font-weight:800}#tochigi-map-app .intro{text-align:center;margin:0 0 16px;color:#4c6472;font-size:14px}#tochigi-map-app .layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(230px,.85fr);gap:20px}#tochigi-map-app .map-panel{position:relative;min-height:420px;background:#fff;border:1px solid #dbe9e8;border-radius:16px;padding:12px}#tochigi-map-app #mapSvg{display:block;width:100%;height:auto;min-height:390px}#tochigi-map-app .municipality{fill:#bce9d4;stroke:#fff;stroke-width:1.15;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}#tochigi-map-app .municipality:hover,#tochigi-map-app .municipality:focus{fill:#ffda77;outline:none;stroke:#e19222;stroke-width:2}#tochigi-map-app .map-label{font-size:9px;fill:#173a3a;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round;font-weight:700}#tochigi-map-app .map-label.small{font-size:7px}#tochigi-map-app .right-panel{background:#fff;border:1px solid #dbe9e8;border-radius:16px;padding:16px}#tochigi-map-app .right-panel h3{margin:0 0 10px;font-size:17px}#tochigi-map-app .city-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}#tochigi-map-app .city-list a{display:block;color:#165f72;text-decoration:none;background:#f1f9f7;border:1px solid #d8eae6;border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;font-weight:700}#tochigi-map-app .city-list a:hover,#tochigi-map-app .city-list a:focus{background:#ffebba;color:#623b08}#tochigi-map-app .info{text-align:center;font-size:13px;margin:12px 0 0;color:#637483;min-height:20px}#tochigi-map-app .foot{text-align:center;font-size:11px;color:#667986;margin:13px 0 0}#tochigi-map-app .fallback{text-align:center;font-size:14px;fill:#687b83}#tochigi-map-app .map-loader{font-size:13px;text-align:center;color:#436b78}@media(max-width:700px){#tochigi-map-app .layout{grid-template-columns:1fr}#tochigi-map-app .map-panel{min-height:270px}#tochigi-map-app #mapSvg{min-height:260px}#tochigi-map-app .city-list{grid-template-columns:repeat(3,1fr)}#tochigi-map-app .city-list a{font-size:12px}}@media(max-width:410px){#tochigi-map-app .city-list{grid-template-columns:1fr 1fr}}
</style></head><body style="margin:0;padding:16px;background:#eaf2f4"><section id="tochigi-map-app"><h2>栃木県 25市町マップ</h2><p class="intro">地図の形または市町村名をクリックすると、それぞれの紹介ページが開きます。</p><div class="layout"><div class="map-panel"><svg id="mapSvg" viewBox="0 0 480 580" role="img" aria-label="栃木県25市町をクリックできる地図"><text x="240" y="278" text-anchor="middle" class="fallback">地図を読み込んでいます…</text></svg><div id="mapInfo" class="info" aria-live="polite">地図または市町村名をクリックすると、各市町村のページが開きます</div></div><div class="right-panel"><h3>市町村名から選ぶ</h3><div class="city-list" id="cityList"></div><p class="foot">各市町村の地図・名前を押すと、専用ページが開きます。</p></div></div><p class="foot">地図データ：Geoshapeリポジトリ。地図が表示されない場合は市町村名一覧から選択できます。</p></section><script>
(function(){
const cities=[{"code":"09201","name":"宇都宮市","url":"https://ourtochipref.jimdofree.com/宇都宮市"},{"code":"09202","name":"足利市","url":"https://ourtochipref.jimdofree.com/足利市/"},{"code":"09203","name":"栃木市","url":"https://ourtochipref.jimdofree.com/栃木市/"},{"code":"09204","name":"佐野市","url":"https://ourtochipref.jimdofree.com/佐野市/"},{"code":"09205","name":"鹿沼市","url":"https://ourtochipref.jimdofree.com/鹿沼市/"},{"code":"09206","name":"日光市","url":"https://ourtochipref.jimdofree.com/日光市/"},{"code":"09208","name":"小山市","url":"https://ourtochipref.jimdofree.com/小山市/"},{"code":"09209","name":"真岡市","url":"https://ourtochipref.jimdofree.com/真岡市/"},{"code":"09210","name":"大田原市","url":"https://ourtochipref.jimdofree.com/大田原市/"},{"code":"09211","name":"矢板市","url":"https://ourtochipref.jimdofree.com/矢板市/"},{"code":"09213","name":"那須塩原市","url":"https://ourtochipref.jimdofree.com/那須塩原市/"},{"code":"09214","name":"さくら市","url":"https://ourtochipref.jimdofree.com/さくら市/"},{"code":"09215","name":"那須烏山市","url":"https://ourtochipref.jimdofree.com/那須烏山市/"},{"code":"09216","name":"下野市","url":"https://ourtochipref.jimdofree.com/下野市/"},{"code":"09301","name":"上三川町","url":"https://ourtochipref.jimdofree.com/上三川町/"},{"code":"09342","name":"益子町","url":"https://ourtochipref.jimdofree.com/益子町/"},{"code":"09343","name":"茂木町","url":"https://ourtochipref.jimdofree.com/茂木町/"},{"code":"09344","name":"市貝町","url":"https://ourtochipref.jimdofree.com/市貝町/"},{"code":"09345","name":"芳賀町","url":"https://ourtochipref.jimdofree.com/芳賀町/"},{"code":"09361","name":"壬生町","url":"https://ourtochipref.jimdofree.com/壬生町/"},{"code":"09364","name":"野木町","url":"https://ourtochipref.jimdofree.com/野木町/"},{"code":"09384","name":"塩谷町","url":"https://ourtochipref.jimdofree.com/塩谷町/"},{"code":"09386","name":"高根沢町","url":"https://ourtochipref.jimdofree.com/高根沢町/"},{"code":"09407","name":"那須町","url":"https://ourtochipref.jimdofree.com/那須町/"},{"code":"09411","name":"那珂川町","url":"https://ourtochipref.jimdofree.com/那珂川町/"}];
// 25市町の指定Jimdoページを設定済み。地図・地図上の文字・一覧のリンク先は共通です。
const root=document.getElementById('tochigi-map-app'),list=root.querySelector('#cityList'),svg=root.querySelector('#mapSvg'),info=root.querySelector('#mapInfo'),NS='http://www.w3.org/2000/svg';
for(const c of cities){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=c.name;list.appendChild(a)}
function flatten(coords,typ){return typ==='Polygon'?[coords]:coords}
function segments(g){let polygons=[];if(!g)return polygons;if(g.type==='FeatureCollection'){for(const f of g.features)polygons.push(...segments(f.geometry));return polygons}if(g.type==='Feature')return segments(g.geometry);if(g.type==='GeometryCollection'){for(const geo of g.geometries)polygons.push(...segments(geo));return polygons}if(g.type==='Polygon')return [g.coordinates];if(g.type==='MultiPolygon')return g.coordinates;return []}
function project(pt,b){return [((pt[0]-b.minX)/(b.maxX-b.minX))*440+20, 560-((pt[1]-b.minY)/(b.maxY-b.minY))*520]}
function makePath(polys,b){return polys.map(p=>p.map(r=>r.map((q,i)=>{const [x,y]=project(q,b);return (i?'L':'M')+x.toFixed(2)+','+y.toFixed(2)}).join(' ')+'Z').join(' ')).join(' ')}
async function load(){let completed=await Promise.allSettled(cities.map(async c=>{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch('https://geoshape.ex.nii.ac.jp/city/geojson/latest/'+c.code+'.geojson',{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();return {...c,polys:segments(data)}}finally{clearTimeout(t)}}));let shapes=completed.filter(x=>x.status==='fulfilled'&&x.value.polys.length).map(x=>x.value);if(!shapes.length){svg.innerHTML='<text x="240" y="270" text-anchor="middle" class="fallback">地図が読み込めませんでした</text><text x="240" y="293" text-anchor="middle" class="fallback">右の市町村一覧から選べます</text>';info.textContent='外部の地図データへの接続を確認してください';return}
let b={minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity};for(let s of shapes)for(let p of s.polys)for(let ring of p)for(let [x,y] of ring){b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
svg.replaceChildren();svg.setAttribute('viewBox','0 0 480 580');for(let c of shapes){const a=document.createElementNS(NS,'a');a.setAttribute('href',c.url);a.setAttribute('target','_blank');a.setAttribute('rel','noopener noreferrer');a.setAttribute('aria-label',c.name);const title=document.createElementNS(NS,'title');title.textContent=c.name;a.appendChild(title);const path=document.createElementNS(NS,'path');path.setAttribute('class','municipality');path.setAttribute('fill','#bce9d4');path.setAttribute('stroke','#ffffff');path.style.setProperty('fill','#bce9d4','important');path.style.setProperty('stroke','#ffffff','important');path.style.setProperty('stroke-width','1.15px','important');path.setAttribute('d',makePath(c.polys,b));path.setAttribute('fill-rule','evenodd');a.appendChild(path);a.addEventListener('mouseenter',()=>{path.style.setProperty('fill','#ffda77','important');info.textContent=c.name+' をクリックして移動'});a.addEventListener('mouseleave',()=>{path.style.setProperty('fill','#bce9d4','important');info.textContent='地図または市町村名をクリックすると、各市町村のページが開きます'});svg.appendChild(a)}
// Centroids from polygon outer-ring vertices; label as many as can fit
for(const c of shapes){let largest=c.polys.map(p=>p[0]).sort((a,b)=>b.length-a.length)[0];if(!largest)continue;let xx=0,yy=0;for(let pt of largest){xx+=pt[0];yy+=pt[1]}let [x,y]=project([xx/largest.length,yy/largest.length],b);let text=document.createElementNS(NS,'text');text.setAttribute('x',x);text.setAttribute('y',y);text.setAttribute('class','map-label'+(c.name.length>4?' small':''));text.textContent=c.name;text.style.pointerEvents='auto';text.style.cursor='pointer';const labelLink=document.createElementNS(NS,'a');labelLink.setAttribute('href',c.url);labelLink.setAttribute('target','_blank');labelLink.setAttribute('rel','noopener noreferrer');labelLink.setAttribute('aria-label',c.name+'のページへ');labelLink.appendChild(text);svg.appendChild(labelLink)}
if(shapes.length!==25)info.textContent=shapes.length+'市町の地図を表示中。表示されない市町は一覧から選択してください';}
load().catch(()=>info.textContent='地図を読み込めない場合は、市町村名一覧から選択できます');
})();</script></body></html>
